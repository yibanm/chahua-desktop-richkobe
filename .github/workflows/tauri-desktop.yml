name: Tauri Desktop Build

# 阶段一（CLAUDE.md 0.11）：推 dev 分支或手动触发即构建，产物只上传为 workflow artifact；
# 阶段二：推 v* 标签时，同一 job 末尾自动创建 GitHub Release 并附上合规命名的产物。
on:
  workflow_dispatch:
  push:
    branches: [dev, build]
    tags: ['v*']
    paths:
      - 'pwa/**'
      - 'CHANGELOG.md'
      - '.github/workflows/tauri-desktop.yml'

# 同一分支的新推送取消旧运行，避免浪费额度
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 创建 Release 需要写权限；分支构建不会用到，但 permissions 无法按 ref 分级
  contents: write

env:
  # 上游 pwa/.nvmrc pin v24.22.0，CI 与本地保持一致以免构建差异
  NODE_VERSION: '24.22.0'

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pwa

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # dtolnay/rust-toolchain：MIT 许可。
      # 刻意不用 Swatinem/rust-cache —— 它是 LGPL-3.0（见全局经验 2026-11-03 CI 许可证条目），
      # 缓存改用下面的 MIT actions/cache 手动实现，效果等价。
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Rust 依赖缓存：key 绑定 Cargo.lock，命中可省 10+ 分钟编译
      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pwa/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('pwa/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('pwa/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # npm ci 会触发 postinstall（emoji picker 代码生成），是构建必需步骤
      - name: Install frontend dependencies
        run: npm ci

      # 产物命名规范（CLAUDE.md 0.10）：软件名-版本-平台.扩展名
      # 软件名固定为对外发布名 chahua-tauri（小写连字符）；productName 是中文界面名，
      # 不能进产物文件名。版本一律从 tauri.conf.json 读取，杜绝版本不同步。
      - name: Resolve artifact naming
        id: naming
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const name = "chahua-tauri";
            const version = c.version.replace(/^v/, "");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup=${name}-${version}-windows-x64-setup.exe\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `portable=${name}-${version}-windows-x64-portable.zip\n`);
          '
          echo "setup  -> ${{ steps.naming.outputs.setup }}"
          echo "portable -> ${{ steps.naming.outputs.portable }}"

      # tauri-action 内部会执行 beforeBuildCommand（npm run build:tauri），
      # 故此处不再单独跑前端构建，避免重复构建与产物覆盖。
      # 本项目 API 地址写死在 angular.json 的 define 里、不依赖 CI 环境变量，
      # 因此不存在「二次构建冲掉环境变量」的隐患（全局经验 2026-11-03 坑点 1）。
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: pwa
          # 只构建 NSIS 安装包：MSI 体积大且用户场景不需要，省 CI 时间
          args: --bundles nsis
          # 阶段一不创建 Release，仅本地构建
          uploadWorkflowArtifacts: false

      # 按规范重命名 NSIS 产物。
      # 用 glob 定位而非硬编码文件名（全局经验 2026-11-03 坑点 3：产物名可能含本地化文字）
      - name: Rename setup artifact
        shell: bash
        run: |
          mkdir -p ../dist-release
          found=$(find src-tauri/target/release/bundle/nsis -name '*setup*.exe' | head -1)
          if [ -z "$found" ]; then
            echo "::error::未找到 NSIS setup.exe，bundle 目录内容："
            find src-tauri/target/release/bundle -type f || true
            exit 1
          fi
          echo "找到: $found"
          cp "$found" "../dist-release/${{ steps.naming.outputs.setup }}"
          ls -la ../dist-release

      # 便携版：Tauri 把前端资源内嵌进单个 exe，压 zip 即为便携版
      # （全局经验 2026-11-03 坑点 5：Tauri 便携版 = 单 exe，不需打包运行时目录）
      # exe 文件名随 productName（中文），必须 glob 定位，不硬编码（坑点 3）
      - name: Create portable zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter '*.exe' |
            Where-Object { $_.Name -notmatch '^(msi|nsis)' } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "未找到可执行文件"
            Get-ChildItem -Recurse src-tauri/target/release -Filter '*.exe' | Select-Object FullName
            exit 1
          }
          Write-Output ("找到 exe: " + $exe.Name)
          Compress-Archive -Path $exe.FullName -DestinationPath "../dist-release/${{ steps.naming.outputs.portable }}" -Force
          Get-ChildItem ../dist-release | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chahua-tauri-${{ steps.naming.outputs.version }}-windows-x64
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

      - name: Report sizes
        shell: bash
        run: |
          echo "### 产物清单" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la ../dist-release/ >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 阶段二：仅标签推送时创建 Release（CLAUDE.md 0.11 第 2 条）。
      # 说明文字从 CHANGELOG.md 抽当前版本段落，禁止把日志写死在这里（0.10 第 8 条）。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          awk -v ver="$ver" '
            BEGIN { p = 0 }
            $0 ~ "^## v" ver "([[:space:]]|$)" { p = 1; next }
            p && /^## / { exit }
            p { print }
          ' ../CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md 中未找到 ## v${ver} 段落，拒绝发布空说明"
            exit 1
          fi
          gh release create "$tag" ../dist-release/* \
            --title "茶话桌面版 v${ver}" \
            --notes-file notes.md
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
