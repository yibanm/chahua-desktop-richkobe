name: Tauri Desktop Build

# 阶段一（CLAUDE.md 0.11）：推 dev 分支或手动触发即构建，产物只上传为 workflow artifact；
# 阶段二：推 v* 标签时，release job 汇总全平台产物自动创建 GitHub Release。
# 平台矩阵（用户 2026-11-07 指令）：Windows 安装版+便携版、macOS、Linux；安卓只出 arm64-v8a 与 armeabi-v7a。
on:
  workflow_dispatch:
  push:
    branches: [dev, build]
    tags: ['v*']
    paths:
      - 'pwa/**'
      - 'CHANGELOG.md'
      - 'version.json'
      - '.github/workflows/tauri-desktop.yml'

# 同一分支的新推送取消旧运行，避免浪费额度
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 创建 Release 需要写权限；分支构建不会用到，但 permissions 无法按 ref 分级
  contents: write

env:
  # 上游 pwa/.nvmrc pin v24.22.0，CI 与本地保持一致以免构建差异
  NODE_VERSION: '24.22.0'

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            bundles: nsis
          - os: macos-latest
            label: macos-arm64
            bundles: dmg
          - os: ubuntu-latest
            label: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pwa

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # dtolnay/rust-toolchain：MIT 许可。
      # 刻意不用 Swatinem/rust-cache —— 它是 LGPL-3.0（见全局经验 2026-11-03 CI 许可证条目），
      # 缓存改用下面的 MIT actions/cache 手动实现，效果等价。
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Rust 依赖缓存：key 绑定 Cargo.lock，命中可省 10+ 分钟编译
      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pwa/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('pwa/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ matrix.os }}-npm-${{ hashFiles('pwa/package-lock.json') }}
          restore-keys: |
            ${{ matrix.os }}-npm-

      # npm ci 会触发 postinstall（emoji picker 代码生成），是构建必需步骤
      - name: Install frontend dependencies
        run: npm ci

      # 产物命名规范（CLAUDE.md 0.10）：软件名-版本-平台.扩展名
      - name: Resolve artifact naming
        id: naming
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const name = "chahua-tauri";
            const version = c.version.replace(/^v/, "");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          '
          echo "version=${{ steps.naming.outputs.version }} label=${{ matrix.label }}"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: pwa
          args: --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: false

      # 按规范重命名产物（glob 定位，产物名可能含本地化文字）
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p ../dist-release
          v="${{ steps.naming.outputs.version }}"
          case "${{ matrix.label }}" in
            windows-x64)
              setup=$(find src-tauri/target/release/bundle/nsis -name '*setup*.exe' | head -1)
              [ -n "$setup" ] || { echo "::error::未找到 NSIS setup.exe"; exit 1; }
              cp "$setup" "../dist-release/chahua-tauri-${v}-windows-x64-setup.exe"
              exe=$(find src-tauri/target/release -maxdepth 1 -name '*.exe' ! -name '*msi*' | head -1)
              cd src-tauri/target/release && powershell -NoProfile -Command "Compress-Archive -Path '$(basename "$exe")' -DestinationPath '../../../../dist-release/chahua-tauri-${v}-windows-x64-portable.zip' -Force" && cd ../../..
              ;;
            macos-arm64)
              dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
              [ -n "$dmg" ] || { echo "::error::未找到 dmg"; exit 1; }
              cp "$dmg" "../dist-release/chahua-tauri-${v}-macos-arm64.dmg"
              ;;
            linux-x64)
              deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
              app=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
              [ -n "$deb" ] && cp "$deb" "../dist-release/chahua-tauri-${v}-linux-x64.deb"
              [ -n "$app" ] && cp "$app" "../dist-release/chahua-tauri-${v}-linux-x64.AppImage"
              ls ../dist-release || { echo "::error::未找到 deb/AppImage"; exit 1; }
              ;;
          esac
          ls -la ../dist-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.label }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk/targetSdk 由 tauri android init 生成为 37，装 35 会构建失败
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: android-npm-${{ hashFiles('pwa/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build APKs (v7a + v8a only)
        env:
          TAURI_ANDROID_NDK_VERSION: '27.0.12077973'
        # tauri CLI 的 --target 只收短名（aarch64/armv7/i686/x86_64），写完整 rust triple 会报 invalid value
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p ../dist-release
          v=$(node -e 'console.log(require("./src-tauri/tauri.conf.json").version)')
          # tauri 的 per-target 产物是 gradle flavor APK：aarch64→app-arm64-release，armv7→app-arm-release
          # 注意 arm 是 arm64 的子串，glob 必须带 release 段区分
          a64=$(find src-tauri/gen/android/app/build/outputs/apk -name 'app-arm64-release*.apk' | head -1)
          a32=$(find src-tauri/gen/android/app/build/outputs/apk -name 'app-arm-release*.apk' | head -1)
          [ -n "$a64" ] || { echo "::error::未找到 arm64 apk"; find src-tauri/gen/android/app/build/outputs -name '*.apk'; exit 1; }
          [ -n "$a32" ] || { echo "::error::未找到 armv7 apk"; find src-tauri/gen/android/app/build/outputs -name '*.apk'; exit 1; }
          cp "$a64" "../dist-release/chahua-tauri-${v}-android-arm64.apk"
          cp "$a32" "../dist-release/chahua-tauri-${v}-android-armv7.apk"
          ls -la ../dist-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-android
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: dist-release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          # 发版前校验 version.json 与 tag 一致：更新检查靠仓库里的 version.json，
          # 若忘记同步，老客户端永远检测不到新版（更新闭环静默断裂）。不一致直接 fail。
          manifest_ver=$(node -e 'console.log(require("./version.json").version)')
          if [ "$manifest_ver" != "$ver" ]; then
            echo "::error::version.json 的 version ($manifest_ver) 与 tag ($ver) 不一致，拒绝发布。"
            exit 1
          fi
          awk -v ver="$ver" '
            BEGIN { p = 0 }
            $0 ~ "^## v" ver "([[:space:]]|$)" { p = 1; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md 中未找到 ## v${ver} 段落，拒绝发布空说明"
            exit 1
          fi
          ls -la dist-release
          gh release create "$tag" dist-release/* \
            --title "茶话桌面版 v${ver}" \
            --notes-file notes.md
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
